<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prove - Character Card</title>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="W08 Prove: Character Card">
    <meta property="og:url" content="https://yourURLofPage.here">
    <meta property="og:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="W08 Prove: Character Card">
    <meta name="twitter:image" content="https://yourURLofSocialPreviewImageHere.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="charactercard.css" />
    <script src="charactercard.js" defer></script>
</head>

<body>
    <div class="card">
        <h1 class="name"></h1>
        <list class="stats">
            <p class="class"></p>
            <p class="level"></p>
            <p class="health"></p>
        </list>

        <img class="image">

        <button class="attack">Attacked</button>
        <button class="levelUp">Level Up</button>
    </div>
</body>

</html>
